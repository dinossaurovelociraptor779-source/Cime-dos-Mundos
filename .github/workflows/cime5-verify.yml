name: Cime 5.0 verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q api server_v5.py server_legacy.py

      - name: Import backend
        env:
          CIME_DATA_DIR: /tmp/cime5-ci
          CIME_PORT: "8790"
          CIME_BIND: "127.0.0.1"
        run: |
          rm -rf /tmp/cime5-ci
          python - <<'PY'
          import api.index
          import server_v5
          assert server_v5.google_ok(), "Google Client ID is not configured"
          print("Python backend import: OK")
          print("Google client: OK")
          PY

      - name: Verify frontend auth wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert "https://accounts.google.com/gsi/client" in html
          assert "/api/auth/google/credential" in html
          assert "/api/auth/status?ts=" in html
          assert "location.assign('/oauth/google/start')" not in html
          print("Frontend auth wiring: OK")
          PY
